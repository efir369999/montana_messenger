language = "C"
include_guard = "MONTANA_FFI_H"
autogen_warning = "/* Generated by cbindgen from mt-bindings (network.rs/mdns.rs). Do not edit by hand -- SSOT is the Rust code. Regenerate: cbindgen --config cbindgen.toml crates/mt-bindings -o crates/mt-bindings/include/montana_ffi.h */"
pragma_once = false
tab_width = 4
style = "type"

[export]
prefix = ""

# size_t (not uintptr_t) -- Swift imports it as Int, the same type as in mt_bindings.h
usize_is_size_t = true
