# Montana full node: one command from a clean clone.
#
#   git clone https://github.com/efir369999/montana_messenger
#   cd montana_messenger/node
#   docker compose up -d --build
#
# Default = singleton mode: the node runs its own genesis TimeChain with no
# external peers. To join a network, mount a genesis-manifest.json with real
# peers (see README.md) by uncommenting the two manifest lines below.
#
# Do not add `tty: true`: the entrypoint keeps the recovery words out of the
# container log, and a terminal is one more place they could reach.

services:
  montana-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: montana-node:student
    container_name: montana-node
    # Linux VPS: host networking is best for libp2p P2P / NAT advertisement.
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - montana-data:/var/lib/montana
      # Join an existing network: a manifest with REAL peers, read-only.
      # - ./genesis-manifest.json:/etc/montana/genesis-manifest.json:ro
    environment:
      MONTANA_LISTEN: /ip4/0.0.0.0/tcp/8444
      # "1" = compete for Active (montana-node start --enable-candidate).
      MONTANA_ENABLE_CANDIDATE: "0"
      # MONTANA_GENESIS_MANIFEST: /etc/montana/genesis-manifest.json
      # MONTANA_MANIFEST_SHA256: ""   # set to refuse start on manifest drift
      # MONTANA_REPORT_URL: ""        # unset or empty = the node reports to nobody
    healthcheck:
      test: ["CMD", "/usr/local/bin/montana-node", "status", "--data-dir", "/var/lib/montana"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

volumes:
  # Holds identity.bin and mnemonic.txt: the node keys. `docker compose down -v`
  # deletes it, and with it the node.
  montana-data:
